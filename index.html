<!doctype html>
<html lang="ko">
<head>
<title>머니북</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2F5BFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="머니북">
<style>
/* 레이아웃: 영수증 다이어리. 위 헤더(월 이동·탭) + 한 열/두 열 카드 + 모바일 아래 탭바, 기록은 오른쪽(모바일은 아래)에서 열리는 시트 */
:root{
  --bg:#ECEFF3; --card:#FFFFFF; --soft:#F3F5F8; --ink:#14161B; --mute:#667085; --faint:#A3ABB8; --line:#DCE1E8;
  --blue:#2F5BFF; --blue-ink:#1B3FCC; --blue-soft:#E4EAFF; --hero:#2F5BFF; --on-hero:#FFFFFF;
  --coral:#F2502F; --coral-soft:#FFE7E1; --green:#0E9460; --green-soft:#DDF5EA; --amber:#B97800; --amber-soft:#FFF2CC;
  --h1:#E4EAFF; --h2:#B9C8FF; --h3:#7D97FF; --h4:#FF6447; --h3-ink:#FFFFFF;
  --paper:#FFFFFF; --shade:rgba(20,22,27,.35);
  --f-ui:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r-card:22px; --r-ctl:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --card:#191C22; --soft:#22262E; --ink:#ECEEF2; --mute:#9AA3B2; --faint:#5F6775; --line:#2C313B;
  --blue:#7590FF; --blue-ink:#A9BBFF; --blue-soft:#1F2847; --hero:#3450D8; --on-hero:#FFFFFF;
  --coral:#FF7A5E; --coral-soft:#3A211C; --green:#3CCB8F; --green-soft:#15301F; --amber:#F2B53A; --amber-soft:#33290F;
  --h1:#1F2847; --h2:#2D3E7A; --h3:#4F68D6; --h4:#E2553A; --paper:#1D2027; --shade:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1115; --card:#191C22; --soft:#22262E; --ink:#ECEEF2; --mute:#9AA3B2; --faint:#5F6775; --line:#2C313B;
  --blue:#7590FF; --blue-ink:#A9BBFF; --blue-soft:#1F2847; --hero:#3450D8; --on-hero:#FFFFFF;
  --coral:#FF7A5E; --coral-soft:#3A211C; --green:#3CCB8F; --green-soft:#15301F; --amber:#F2B53A; --amber-soft:#33290F;
  --h1:#1F2847; --h2:#2D3E7A; --h3:#4F68D6; --h4:#E2553A; --paper:#1D2027; --shade:rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
h1,h2,h3{text-wrap:balance}

/* 헤더 */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:900;font-size:20px;letter-spacing:-.03em;margin:0}
.brand span{color:var(--coral)}
.mnav{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.mnav button{border:0;background:transparent;width:32px;height:30px;border-radius:999px;color:var(--mute)}
.mnav button:hover{background:var(--soft);color:var(--ink)}
.mnav b{font-size:14px;padding:0 6px;white-space:nowrap}
.tabs{display:flex;gap:2px;margin-left:auto}
.tabs a{padding:8px 13px;border-radius:999px;text-decoration:none;color:var(--mute);font-weight:700;font-size:14px}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.store{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px;white-space:nowrap}
.store i{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.store.ok i{background:var(--green)} .store.warn i{background:var(--amber)}

.banner{max-width:1120px;margin:12px auto 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.banner>div{background:var(--amber-soft);color:var(--ink);border-radius:var(--r-ctl);padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner .btn-s{margin-left:auto}

main{max-width:1120px;margin:0 auto;padding-block:18px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:18px;align-items:start}
.col{display:grid;gap:18px;min-width:0}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:var(--card);border-radius:var(--r-card);padding:20px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 14px}
.card-h h2{font-size:17px;font-weight:900;margin:0;letter-spacing:-.01em}
.card-h small{font-size:12px;color:var(--mute)}
.lbl{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.02em;margin:0}
.muted{color:var(--mute)}
.empty{padding:22px 10px;text-align:center;color:var(--mute);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* 버튼·입력 */
.btn{height:44px;border-radius:var(--r-ctl);border:0;padding:0 18px;font-weight:900;background:var(--coral);color:#fff}
.btn:hover{filter:brightness(1.05)}
.btn.ink{background:var(--ink);color:var(--bg)}
.btn.blue{background:var(--blue);color:#fff}
.btn-s{height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:13px;font-weight:700}
.btn-s:hover{border-color:var(--mute)}
.btn-s.danger{color:var(--coral)}
.btn-link{border:0;background:none;color:var(--blue-ink);font-weight:700;font-size:13px;padding:4px 0}
.inp,.sel{height:44px;border-radius:var(--r-ctl);border:1.5px solid var(--line);background:var(--card);padding:0 12px;width:100%;min-width:0}
.inp:focus,.sel:focus{border-color:var(--blue);outline:none}
.inp.sm,.sel.sm{height:36px;border-radius:10px;font-size:14px}
textarea.inp{height:auto;padding:10px 12px;resize:vertical}
.err{color:var(--coral);font-size:13px;font-weight:700;margin:6px 0 0;min-height:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.fav{border-style:dashed}
.chip.fav b{font-family:var(--f-mono);font-weight:500;margin-left:6px;color:var(--mute)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;height:36px;font-weight:700;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.field{display:grid;gap:6px}
.field>span{font-size:12px;font-weight:700;color:var(--mute)}
.hint{font-size:12px;color:var(--blue-ink);background:var(--blue-soft);border-radius:10px;padding:7px 10px}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--soft);color:var(--mute);margin-left:4px;vertical-align:1px;white-space:nowrap}
.pill.blue{background:var(--blue-soft);color:var(--blue-ink)} .pill.coral{background:var(--coral-soft);color:var(--coral)} .pill.green{background:var(--green-soft);color:var(--green)} .pill.amber{background:var(--amber-soft);color:var(--amber)}

/* 오늘 카드 */
.hero{background:var(--hero);color:var(--on-hero);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.hero p{margin:0}
.hero .k{font-size:15px;font-weight:700;opacity:.92}
.big{font-weight:900;font-size:clamp(44px,7.5vw,72px);letter-spacing:-.045em;line-height:1;margin:10px 0 8px}
.big small{font-size:.36em;font-weight:700;margin-left:4px;letter-spacing:0}
.hero .sub{font-size:14px;opacity:.88}
.meter{margin-top:16px;height:10px;border-radius:5px;background:rgba(255,255,255,.22);overflow:hidden}
.meter i{display:block;height:100%;background:#fff;border-radius:5px;transition:width .6s}
.meter-cap{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-top:6px;opacity:.88;flex-wrap:wrap}
.mini{background:var(--card);border-radius:18px;padding:14px 16px;min-width:0}
.mini b{display:block;font-size:20px;font-weight:900;margin:4px 0 6px;letter-spacing:-.02em}
.mini .bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.mini .bar i{display:block;height:100%;border-radius:3px;background:var(--blue)}
.mini .bar i.over{background:var(--coral)}
.mini small{font-size:12px;color:var(--mute);display:block;margin-top:6px}
.signal{display:flex;gap:4px;margin:6px 0}
.signal i{width:14px;height:14px;border-radius:50%;background:var(--soft)}
.signal i.on.g{background:var(--green)} .signal i.on.y{background:var(--amber)} .signal i.on.r{background:var(--coral)}

/* 빠른 기록 */
.quick{display:grid;gap:10px}
.quick-row{display:grid;grid-template-columns:minmax(0,1fr) 130px 120px auto;gap:8px}

/* 알림 */
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--soft);font-size:13px}
.alert i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--blue)}
.alert.coral i{background:var(--coral)} .alert.amber i{background:var(--amber)} .alert.green i{background:var(--green)}
.alert b{font-weight:700}

/* 주간 막대 */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:150px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.wd .wb{width:100%;max-width:34px;border-radius:10px;background:var(--blue-soft);transition:height .6s}
.wd.today .wb{background:var(--blue)}
.wd.future .wb{background:repeating-linear-gradient(45deg,var(--soft) 0 6px,transparent 6px 12px);border:1px dashed var(--line)}
.wd span{font-size:12px;color:var(--mute);font-weight:700}
.wd.today span{color:var(--blue-ink)}
.wd em{font-style:normal;font-size:11px;color:var(--mute);font-family:var(--f-mono);white-space:nowrap}

/* 달력 */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:12px;text-align:center;color:var(--mute);font-weight:700}
.cal .dow:first-child{color:var(--coral)} .cal .dow:last-child{color:var(--blue-ink)}
.day{aspect-ratio:1;max-width:100%;border-radius:12px;border:0;display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;padding:6px;font-size:12px;font-weight:700;background:var(--soft);text-align:left;position:relative;min-width:0}
.day em{font-style:normal;font-size:10.5px;font-family:var(--f-mono);font-weight:500;text-align:right;overflow:hidden;white-space:nowrap}
.day.l1{background:var(--h1)} .day.l2{background:var(--h2)} .day.l3{background:var(--h3);color:var(--h3-ink)} .day.l4{background:var(--h4);color:#fff}
.day.today{outline:2px solid var(--ink);outline-offset:1px}
.day.sel{box-shadow:0 0 0 3px var(--blue)}
.day.future{background:transparent;border:1px dashed var(--line);color:var(--faint)}
.day .stamp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.day .stamp span{width:62%;aspect-ratio:1;border-radius:50%;border:2px solid var(--coral);color:var(--coral);display:grid;place-items:center;font-size:11px;font-weight:900;transform:rotate(-14deg);background:color-mix(in srgb,var(--card) 70%,transparent)}
.cal-key{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--mute);margin-top:12px;flex-wrap:wrap}
.cal-key i{width:14px;height:14px;border-radius:4px;display:inline-block}

/* 영수증 */
.receipt{background:var(--paper);padding:22px 22px 30px;font-family:var(--f-mono);border-radius:var(--r-card) var(--r-card) 0 0;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%}
.receipt h3{font-family:var(--f-ui);font-weight:900;font-size:17px;margin:0 0 2px;text-align:center}
.receipt .meta{text-align:center;font-size:11px;color:var(--mute);margin:0 0 10px}
.rule{border:0;border-top:1.5px dashed var(--line);margin:10px 0}
.rrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;font-size:13px;padding:5px 4px;border-radius:6px;border:0;background:none;width:100%;text-align:left;font-family:inherit}
.rrow:hover{background:var(--soft)}
.rrow .m{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .m small{color:var(--mute)}
.rrow .d{color:var(--mute)}
.rrow .in{color:var(--blue-ink)} .rrow .rf{color:var(--green)} .rrow .mv{color:var(--mute)}
.rtotal{display:flex;justify-content:space-between;font-size:15px;font-weight:500}
.thanks{text-align:center;font-size:11px;color:var(--mute);margin-top:12px;letter-spacing:.1em}

/* 내역 */
.filters{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;margin-bottom:14px}
.dgroup{margin-bottom:6px}
.dgroup h3{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin:14px 0 4px;font-weight:700}
.txrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;border:0;background:none;width:100%;text-align:left}
.txrow:hover{background:var(--soft)}
.txrow .m{min-width:0}
.txrow .m b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.txrow .m small{font-size:12px;color:var(--mute)}
.txrow .v{font-family:var(--f-mono);font-size:14px;text-align:right;white-space:nowrap}
.v.in{color:var(--blue-ink)} .v.rf{color:var(--green)} .v.mv{color:var(--mute)}
.sumline{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.sumline b{display:block;font-size:18px;color:var(--ink);font-weight:900}

/* 분류 칩 막대 */
.bud{display:grid;gap:8px}
.bchip{position:relative;overflow:hidden;border-radius:14px;padding:10px 12px;background:var(--soft);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.bchip .bg{position:absolute;inset:0 auto 0 0;background:var(--blue-soft);transition:width .6s}
.bchip.over .bg{background:var(--coral-soft)}
.bchip>*{position:relative}
.bchip b{font-size:14px}
.bchip span{font-family:var(--f-mono);font-size:12px;color:var(--mute);text-align:right;white-space:nowrap}
.bchip.over span{color:var(--coral)}
.bchip small{display:block;font-size:11px;font-weight:500;color:var(--mute)}

.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--mute);font-family:var(--f-ui)}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:12px;color:var(--mute);font-weight:700;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr:last-child td{border-bottom:0}

/* 장부 */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.subtabs button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--mute)}
.subtabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item b{font-weight:700}
.item small{display:block;font-size:12px;color:var(--mute)}
.pbar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--blue);border-radius:4px}
.pbar i.done{background:var(--green)} .pbar i.over{background:var(--coral)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}

/* 시트 */
.shade{position:fixed;inset:0;background:var(--shade);z-index:40}
.sheet{position:fixed;z-index:50;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--card);overflow-y:auto;padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:14px;align-content:start;box-shadow:-10px 0 40px rgba(0,0,0,.15)}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.sheet-h h2{margin:0;font-size:20px;font-weight:900}
.x{border:0;background:var(--soft);width:36px;height:36px;border-radius:50%;font-size:18px}
.amt-big{font-size:28px;font-weight:900;height:58px;letter-spacing:-.02em}
.split-row{display:grid;grid-template-columns:minmax(0,1fr) 120px 36px;gap:6px}
.sheet-foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sheet-foot .btn{flex:1}

.fab{position:fixed;z-index:30;right:max(20px,calc(env(safe-area-inset-right,0px) + 20px));bottom:calc(24px + env(safe-area-inset-bottom,0px));height:56px;padding:0 22px;border-radius:28px;border:0;background:var(--coral);color:#fff;font-weight:900;font-size:16px;box-shadow:0 8px 24px rgba(242,80,47,.35)}
.tabbar{display:none}
.toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:700;max-width:calc(100% - 32px)}

.confirm{background:var(--coral-soft);border-radius:14px;padding:12px;display:grid;gap:8px;font-size:13px}
.confirm div{display:flex;gap:8px}

@media (max-width:900px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .tabs{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:fixed;z-index:30;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar a{text-align:center;padding:10px 0 12px;font-size:12px;font-weight:700;color:var(--mute);text-decoration:none}
  .tabbar a[aria-current="page"]{color:var(--ink)}

async function ghFetchFile(name){const r=await ghApi("/contents/"+name);

/* ───────── 조회 ───────── */
const allCats=()=>cfg().cats.concat(cfg().incs);
const catOf=id=>allCats().find(c=>c.id===id);
const catName=id=>{const c=catOf(id);return c?c.n:"분류 없음"};
const payOf=id=>cfg().pays.find(p=>p.id===id);
const payName=id=>{const p=payOf(id);return p?p.n:""};
const activeCats=()=>cfg().cats.filter(c=>!c.off);
const budgetTotal=()=>activeCats().reduce((a,c)=>a+(c.b||0),0);
const txList=()=>Object.entries(D().tx);
const partsOf=t=>t.parts&&t.parts.length?t.parts:[{cat:t.cat,amt:t.amt}];
const locked=M=>!!(D().months[M]&&D().months[M].closed);

function mstats(M){
  const r={out:0,inc:0,cat:{},day:{},free:{},list:[]};
  for(const [id,t] of txList()){
    if(!t.date||t.date.slice(0,7)!==M)continue; r.list.push([id,t]);
    if(t.type==="in"){r.inc+=t.amt;continue}
    if(t.type==="move")continue;
    const sg=t.type==="refund"?-1:1, d=Number(t.date.slice(8));
    partsOf(t).forEach(p=>{r.cat[p.cat]=(r.cat[p.cat]||0)+sg*p.amt});
    r.out+=sg*t.amt; r.day[d]=(r.day[d]||0)+sg*t.amt;
    if(!t.recur&&t.type==="out") r.free[d]=(r.free[d]||0)+t.amt;
  }
  return r;
}
function recurTxId(rid,M){return "r-"+rid+"-"+M}
function upcomingRecur(M,day){
  let s=0;const items=[];
  for(const [rid,r] of Object.entries(D().recur)){
    if(!r.on||r.type!=="out"||(r.start&&r.start>M)||(r.skip||[]).includes(M))continue;
    if(D().tx[recurTxId(rid,M)])continue;
    const dd=Math.min(r.day,daysIn(M)); if(dd>day){s+=r.amt;items.push(r)}
  }
  return {sum:s,items};
}
function ensureRecurring(){
  if(S.demo||S.readOnly)return;
  const T=todayStr(),CM=ymOf(T),d=Number(T.slice(8));let added=0;
  for(const [rid,r] of Object.entries(S.real.recur)){
    if(!r.on)continue;
    for(let k=-2;k<=0;k++){
      const M=addM(CM,k); if(r.start&&r.start>M)continue; if((r.skip||[]).includes(M))continue; if(locked(M))continue;
      const dd=Math.min(r.day,daysIn(M)); if(k===0&&dd>d)continue;
      const id=recurTxId(rid,M); if(S.real.tx[id])continue;
      put("tx",id,{date:M+"-"+pad(dd),type:r.type,cat:r.cat,amt:r.amt,memo:r.n,pay:r.pay,recur:rid,at:Date.now()});added++;
    }
  }
  if(added){toast("고정 "+(added>1?added+"건":"지출")+"을 자동으로 넣었어요");schedule()}
}
function weekRange(T){const d=new Date(T+"T00:00:00");const w=(d.getDay()+6)%7;const s=new Date(d);s.setDate(d.getDate()-w);
  const out=[];for(let i=0;i<7;i++){const x=new Date(s);x.setDate(s.getDate()+i);out.push(x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate()))}return out}
function dayOut(dateStr){let s=0;for(const [,t] of txList()){if(t.date!==dateStr)continue;if(t.type==="out")s+=t.amt;else if(t.type==="refund")s-=t.amt}return s}
function smallWeek(T){const days=new Set(weekRange(T));const small=new Set(cfg().cats.filter(c=>c.s).map(c=>c.id));let s=0;
  for(const [,t] of txList()){if(!days.has(t.date)||(t.type!=="out"&&t.type!=="refund"))continue;const sg=t.type==="refund"?-1:1;partsOf(t).forEach(p=>{if(small.has(p.cat))s+=sg*p.amt})}return s}
function homeVsOut(r){let h=0,o=0;cfg().cats.forEach(c=>{if(c.k==="home")h+=r.cat[c.id]||0;if(c.k==="out")o+=r.cat[c.id]||0});return{h,o,ratio:h+o?o/(h+o)*100:0}}
function instPart(t,k){const base=Math.floor(t.amt/t.inst);return k===t.inst?t.amt-base*(t.inst-1):base}
function billFor(pid,B){let s=0;for(const [,t] of txList()){if(t.pay!==pid||(t.type!=="out"&&t.type!=="refund"))continue;const P=ymOf(t.date);
  if(t.type==="out"&&t.inst>=2){const k=mDiff(P,B);if(k>=1&&k<=t.inst)s+=instPart(t,k)} else if(addM(P,1)===B) s+=(t.type==="refund"?-1:1)*t.amt}return s}
function cardUse(pid,M){let s=0;for(const [,t] of txList()){if(t.pay!==pid||!t.date.startsWith(M))continue;if(t.type==="out")s+=t.amt;else if(t.type==="refund")s-=t.amt}return s}
function installments(CM){const out=[];for(const [id,t] of txList()){if(t.type!=="out"||!(t.inst>=2))continue;const P=ymOf(t.date);
  const billed=clamp(mDiff(P,CM),0,t.inst);const left=t.inst-billed;const end=addM(P,t.inst);
  let leftAmt=0;for(let k=billed+1;k<=t.inst;k++)leftAmt+=instPart(t,k);
  if(left>0||end===CM)out.push({id,t,billed,left,end,leftAmt,monthly:instPart(t,Math.max(1,billed||1))})}
  return out.sort((a,b)=>a.end<b.end?-1:1)}
function lastBuys(memo,exceptId){const m=memo.trim();if(m.length<1)return[];return txList().filter(([id,t])=>id!==exceptId&&t.type==="out"&&(t.memo||"").trim()===m).sort((a,b)=>a[1].date<b[1].date?1:-1).slice(0,3)}

function alerts(T,r){

  const ms=[];for(let k=-5;k<=0;k++){const MM=addM(M,k),s=mstats(MM);ms.push({M:MM,o:s.out,i:s.inc})}
  const mx=Math.max(1,...ms.map(x=>Math.max(x.o,x.i))),W=560,H=200,L=8,B=26,T0=16,bw=(W-L*2)/6;

    svg+=`<rect x="${x0}" y="${H-B-hi}" width="${w}" height="${hi}" rx="5" fill="var(--blue-soft)"/><rect x="${x0+w+3}" y="${H-B-ho}" width="${w}" height="${ho}" rx="5" fill="${i===5?"var(--coral)":"var(--h3)"}"/>`;
    svg+=`<text x="${x0+w+1.5}" y="${H-8}" text-anchor="middle" font-size="12" ${i===5?'style="fill:var(--ink);font-weight:700"':""}>${mShort(x.M)}</text>`;
    if(x.o)svg+=`<text x="${x0+w*1.5+3}" y="${H-B-ho-5}" text-anchor="middle" font-size="10.5" font-family="IBM Plex Mono">${man(x.o)}</text>`});
  const trend=`<div class="card chart"><div class="card-h"><h2>최근 6개월</h2><small><span style="color:var(--blue-ink)">■</span> 수입 <span style="color:var(--h3)">■</span> 지출</small></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 6개월 수입과 지출 막대">${svg}</svg></div>`;

    <p class="muted" style="font-size:12px;margin:10px 0 0">${sal?`카드 등 사용액 공제는 총급여의 25%(${won(th)}원)를 넘게 쓴 부분부터 따져요. 지금 ${cardSum>th?`<b style="color:var(--green)">${won(cardSum-th)}원 넘었어요</b>`:`문턱까지 ${won(th-cardSum)}원 남았어요`}.`:"설정에 총급여를 넣으면 카드 공제 문턱(총급여의 25%)까지 얼마 남았는지 보여 드려요."} 현금은 현금영수증을 받은 것만 공제돼요. 실제 금액은 홈택스 간소화 자료로 확인하세요.</p></div>`;
  const mc=D().months[M]||{},chk=mc.checks||{};
  const close=`<div class="card" id="close-card"><div class="card-h"><h2>${mShort(M)} 마감</h2>${mc.closed?`<span class="pill coral">마감됨</span>`:""}</div>
    ${mc.closed?`<p style="margin:0 0 10px;font-size:14px">${new Date(mc.at).toLocaleDateString("ko-KR")}에 마감했어요. 마감한 달은 기록을 고칠 수 없어요.</p>${mc.note?`<p class="hint">${esc(mc.note)}</p>`:""}<div style="margin-top:10px"><button class="btn-s" data-act="reopen">마감 풀기</button></div>`:
    `<div style="display:grid;gap:8px;font-size:14px">

      <textarea class="inp" id="mc-note" rows="2" placeholder="이번 달 메모 (예: 냉장고 고장으로 생활용품 초과)"></textarea>

  return `<div class="grid"><div class="col">${sum}${budCard}${close}</div><div class="col">${trend}${fixed}${tax}</div></div>`;

function vBook(){
  const tabs=[["card","카드·할부"],["recur","고정지출"],["funds","목돈 바구니"],["events","경조사"],["lends","빌려준 돈"]];
  const body={card:bCard,recur:bRecur,funds:bFunds,events:bEvents,lends:bLends}[S.bookTab]();

function bCard(){
  const T=todayStr(),CM=ymOf(T),d=Number(T.slice(8));const cards=cfg().pays.filter(p=>p.k==="card");
  const cc=cards.length?cards.map(p=>{const bd=p.bill||0;let B=CM;if(bd&&d>Math.min(bd,daysIn(CM)))B=addM(CM,1);const nb=billFor(p.id,B),nb2=billFor(p.id,addM(B,1)),use=cardUse(p.id,CM),g=p.goal||0;
    return `<div class="item"><div><b>${esc(p.n)}</b><small>${bd?`결제일 매달 ${bd}일`:"결제일을 설정에서 넣어 주세요"}</small>
      ${g?`<div class="pbar"><i class="${use>=g?"done":""}" style="width:${clamp(use/g,0,1)*100}%"></i></div><small>${mShort(CM)} 실적 ${won(use)} / ${won(g)} ${use>=g?"· 채웠어요":"· "+won(g-use)+" 남음"}</small>`:""}</div>
      <div style="text-align:right"><small>${Number(B.slice(5))}/${bd||"?"} 출금 예정</small><b class="num" style="font-size:18px">${won(nb)}원</b><small>그다음 달(지금까지) ${won(nb2)}원</small></div></div>`}).join(""):`<div class="empty">설정에서 결제수단 종류를 "신용카드"로 두면 여기 나와요.</div>`;
  const ins=installments(CM);
  const fut=[];for(let k=1;k<=6;k++){const B=addM(CM,k);let s=0;ins.forEach(x=>{const kk=mDiff(ymOf(x.t.date),B);if(kk>=1&&kk<=x.t.inst)s+=instPart(x.t,kk)});fut.push({B,s})}
  const fm=Math.max(1,...fut.map(f=>f.s));
  return `<div class="grid"><div class="col"><div class="card"><div class="card-h"><h2>카드 청구 예정</h2></div>${cc}
    <p class="muted" style="font-size:12px;margin:12px 0 0">전월 1일~말일에 쓴 금액이 이번 달 결제일에 나간다고 보고 계산했어요. 카드사마다 이용 기간이 다르니 명세서와 한 번 맞춰 보세요. 할부는 산 다음 달부터 나눠서 넣었어요.</p></div></div>
    <div class="col"><div class="card"><div class="card-h"><h2>할부</h2><small>남은 금액 ${won(ins.reduce((a,x)=>a+x.leftAmt,0))}원</small></div>
    ${ins.length?ins.map(x=>`<div class="item"><div><b>${esc(x.t.memo||catName(x.t.cat))}</b><small>${dShort(x.t.date)} 구매 · ${esc(payName(x.t.pay))} · ${x.t.inst}개월 · 매달 ${won(instPart(x.t,1))}원</small><div class="pbar"><i class="${x.left===0?"done":""}" style="width:${x.billed/x.t.inst*100}%"></i></div><small>${x.billed}/${x.t.inst}회 청구 · ${x.left?`${x.end.replace("-",".")} 청구로 끝나요`:"이번 달로 끝"}</small></div><div style="text-align:right"><small>남은 금액</small><b class="num">${won(x.leftAmt)}</b></div></div>`).join(""):`<div class="empty"><b>진행 중인 할부가 없어요</b>신용카드로 기록할 때 할부 개월을 고르면 여기 쌓여요.</div>`}

function bRecur(){

}

let SH=null;
const coarse=()=>!!(window.matchMedia&&matchMedia("(pointer:coarse)").matches);
function openSheet(opts){
  const t=opts.id?JSON.parse(JSON.stringify(D().tx[opts.id])):{type:opts.type||"out",date:opts.date||todayStr(),cat:"",amt:0,memo:"",pay:"",inst:1};
  if(!t.pay){const po=payOrder();t.pay=po[0]?po[0].id:""}
  SH={id:opts.id||null,t,amtStr:t.amt?String(t.amt):"",split:!!(t.parts&&t.parts.length>1),
    parts:t.parts&&t.parts.length>1?t.parts.map(p=>({cat:p.cat,amt:p.amt})):[{cat:t.cat||"",amt:0},{cat:"",amt:0}],
    confirmDel:false,person:"",rel:"",payTouched:!!opts.id,more:!!t.note,sugs:[]};
  if(SH.id&&t.ev&&D().events[t.ev]){SH.person=D().events[t.ev].person;SH.rel=D().events[t.ev].rel||""}
  drawSheet();
  if(!coarse())setTimeout(()=>{const a=$("#s-amt");if(a){a.focus();try{a.setSelectionRange(a.value.length,a.value.length)}catch(e){}}},30);
}
function closeSheet(){SH=null;$("#sheet-root").innerHTML="";const f=$(".fab");if(f)f.focus()}

  if(!SH)return;const t=SH.t,isOut=t.type==="out",pay=payOf(t.pay),lk=locked(ymOf(t.date)),cat=catOf(t.cat),isEv=cat&&cat.ev&&t.type!=="move";

    <div class="amtbox ${t.type}"><input id="s-amt" class="amt-in num" inputmode="${kp?"none":"numeric"}" value="${esc(fmtExpr(SH.amtStr))}" placeholder="0" autocomplete="off" aria-label="금액"><span>원</span></div>

function saveSheet(more){
  readSheet();const t=SH.t,err=m=>{$("#s-err").textContent=m};
  if(S.readOnly)return err("보기 권한이라 저장할 수 없어요.");
  if(!t.amt)return err("금액을 넣어 주세요.");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(t.date))return err("날짜를 골라 주세요.");
  if(locked(ymOf(t.date)))return err(mShort(ymOf(t.date))+"은 마감된 달이에요. 마감을 풀고 고쳐 주세요.");
  if(SH.id&&locked(ymOf(D().tx[SH.id].date)))return err("원래 날짜의 달이 마감돼 있어요.");
  const o={date:t.date,type:t.type,amt:t.amt,memo:(t.memo||"").trim(),pay:t.pay,at:t.at||Date.now()};
  if(t.note&&t.note.trim())o.note=t.note.trim();if(t.recur)o.recur=t.recur;
  if(t.type==="out"&&SH.split){const ps=SH.parts.filter(p=>p.cat||p.amt);if(ps.some(p=>!p.cat||!p.amt))return err("나눈 줄마다 분류와 금액을 넣어 주세요.");
    const s=ps.reduce((a,p)=>a+p.amt,0);if(s!==t.amt)return err("나눈 금액 합계("+won(s)+"원)가 결제 총액("+won(t.amt)+"원)과 달라요.");
    o.parts=ps;o.cat=ps[0].cat}
  else if(t.type!=="move"){if(!t.cat||!catOf(t.cat))return err("분류를 골라 주세요.");o.cat=t.cat}
  const p=payOf(t.pay);if(t.type==="out"&&p&&p.k==="card"&&t.inst>=2)o.inst=t.inst;
  const id=SH.id||uid();const c=catOf(o.cat);
  if(c&&c.ev&&t.type!=="move"){const person=(SH.person||"").trim();
    if(person){const eid=t.ev||("e"+id);put("events",eid,{date:o.date,person,rel:(SH.rel||"").trim(),kind:(D().events[eid]||{}).kind||"기타",dir:t.type==="in"?"get":"give",amt:o.amt,memo:o.memo,tx:id});o.ev=eid}
    else if(t.ev)del("events",t.ev)}
  else if(t.ev)del("events",t.ev);
  put("tx",id,o);markAdded(id);
  toast(SH.id?"고쳤어요":(o.memo||(t.type==="in"?"수입":t.type==="move"?"이체":t.type==="refund"?"환불":catName(o.cat)))+" "+won(o.amt)+"원 기록했어요");
  const keep={date:o.date,type:o.type};closeSheet();render();if(more)openSheet(keep);
}
function deleteTx(id){const t=D().tx[id];if(!t)return;

async function offerFile(filename,data,mime){
  if(DL){try{await DL.save({filename,data});toast("파일을 저장했어요");return}catch(e){if(e&&e.code==="declined")return;if(e&&e.code==="rate_limited"){toast("저장 창이 이미 열려 있어요");return}}}
  try{const url=URL.createObjectURL(new Blob([data],{type:mime}));const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}catch(e){toast("이 화면에서는 파일을 받을 수 없어요")}}
function csvOf(rows){const q=v=>{const s=String(v==null?"":v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const head=["날짜","종류","분류","내용","금액","결제수단","할부","메모"];const TY={out:"지출",in:"수입",move:"이체",refund:"환불"};
  const lines=[head.join(",")];rows.sort((a,b)=>a[1].date<b[1].date?-1:1).forEach(([,t])=>{partsOf(t).forEach((p,i)=>{lines.push([t.date,TY[t.type],t.type==="move"?"":catName(p.cat),t.memo,(t.type==="refund"?-1:1)*(t.parts&&t.parts.length>1?p.amt:t.amt),payName(t.pay),t.inst>=2?t.inst+"개월":"",t.note||""].map(q).join(","))})});
  return "\uFEFF"+lines.join("\n")}

  "recur-del"(el){if(el.dataset.sure){del("recur",el.dataset.id);toast("고정지출을 지웠어요. 이미 들어간 기록은 남아 있어요.");render()}else{el.dataset.sure="1";el.textContent="한 번 더 누르면 지워요"}},
  "fund-add"(el){const id=el.dataset.id,inp=document.getElementById("fa-"+id),a=toNum(inp.value);if(!a){inp.focus();return toast("적립할 금액을 넣어 주세요")}
    const f=D().funds[id];put("funds",id,Object.assign({},f,{saved:(f.saved||0)+a,log:(f.log||[]).concat([{d:todayStr(),amt:a}])}));inp.value="";toast(f.n+"에 "+won(a)+"원 모았어요");render()},
  "fund-del"(el){if(el.dataset.sure){del("funds",el.dataset.id);render()}else{el.dataset.sure="1";el.textContent="한 번 더 누르면 지워요"}},
  "ev-del"(el){if(!el.dataset.sure){el.dataset.sure="1";el.textContent="한 번 더 누르면 지워요";return}const e=D().events[el.dataset.id];if(e&&e.tx&&D().tx[e.tx]&&!locked(ymOf(D().tx[e.tx].date)))del("tx",e.tx);del("events",el.dataset.id);render()},
  "lend-back"(el){const id=el.dataset.id,l=D().lends[id],inp=document.getElementById("lb-"+id),got=(l.back||[]).reduce((a,b)=>a+b.amt,0),a=toNum(inp.value)||l.amt-got;
    const back=(l.back||[]).concat([{d:todayStr(),amt:a}]),done=got+a>=l.amt;put("lends",id,Object.assign({},l,{back,done}));toast(done?l.person+"에게 다 받았어요":won(a)+"원 받은 걸 적었어요");render()},
  "lend-del"(el){del("lends",el.dataset.id);render()},
  "cat-off"(el){editCfg(c=>{const x=c.cats[Number(el.dataset.i)];x.off=x.off?0:1});render()},
  "inc-off"(el){editCfg(c=>{const x=c.incs[Number(el.dataset.i)];x.off=x.off?0:1});render()},
  "cat-add"(){const n=($("#new-cat").value||"").trim();if(!n)return;editCfg(c=>{c.cats.push({id:"c"+uid(),n,b:0})});$("#new-cat").value="";render()},
  "inc-add"(){const n=($("#new-inc").value||"").trim();if(!n)return;editCfg(c=>{c.incs.push({id:"i"+uid(),n})});$("#new-inc").value="";render()},
  "pay-add"(){const n=($("#new-pay").value||"").trim();if(!n)return;editCfg(c=>{c.pays.push({id:"p"+uid(),n,k:/신용/.test(n)?"card":/체크/.test(n)?"check":"cash"})});$("#new-pay").value="";render()},
};
document.addEventListener("click",e=>{const tb=e.target.closest("a[data-tab]");if(tb){e.preventDefault();go(tb.dataset.tab);return}
  const a=e.target.closest("[data-act]");if(!a)return;if(a.tagName==="BUTTON"||a.dataset.act==="close-sheet")e.preventDefault();const f=ACT[a.dataset.act];if(f)f(a,e)});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&SH){closeSheet();return}
  const tg=e.target,typing=tg&&(tg.tagName==="INPUT"||tg.tagName==="TEXTAREA"||tg.tagName==="SELECT");
  if(SH&&e.key==="Enter"&&tg&&tg.tagName==="INPUT"&&/^s-(amt|memo|note|person|rel)$/.test(tg.id)&&!e.isComposing){e.preventDefault();saveSheet(false);return}
  if(!SH&&!typing&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
    if(e.key==="/"){e.preventDefault();if(S.route!=="home")go("home");const q=$("#q-line");if(q)q.focus()}
    else if(e.key==="n"||e.key==="N"||e.key==="ㅜ"){e.preventDefault();if(!S.readOnly)openSheet({})}}});
document.addEventListener("submit",e=>{const f=e.target.dataset.form;if(!f)return;e.preventDefault();FORM[f]&&FORM[f]()});
const FORM={
  quick(){const er=$("#q-err"),line=$("#q-line");const p=parseLine(line.value);
    if(S.readOnly){er.textContent="보기 권한이라 기록할 수 없어요.";return}
    if(!p){er.textContent="무엇에 얼마 썼는지 적어 주세요. 예: 커피 4500";line.focus();return}
    const cat=S.qover.cat||p.cat;const pay=($("#q-pay")||{}).value||p.pay;
    if(!p.amt){er.textContent="금액을 찾지 못했어요. 숫자로 적어 주세요. 예: 커피 4500";line.focus();return}
    if(!cat){er.textContent="분류를 아래에서 하나 골라 주세요.";return}
    if(locked(ymOf(p.date))){er.textContent=mShort(ymOf(p.date))+"은 마감된 달이에요.";return}
    er.textContent="";const id=uid();const o={date:p.date,type:p.type,cat,amt:p.amt,memo:p.memo||catName(cat),pay,at:Date.now()};
    const pp=payOf(pay);if(o.type==="out"&&pp&&pp.k==="card"&&p.inst>=2)o.inst=p.inst;
    put("tx",id,o);markAdded(id);
    if($("#q-fav").checked)editCfg(c=>{c.favs=(c.favs||[]).concat([{cat,memo:o.memo,amt:o.amt,pay}]).slice(-12)});
    toast(o.memo+" "+won(o.amt)+"원 기록했어요");line.value="";S.qover={};$("#q-fav").checked=false;render();
    if(!coarse())setTimeout(()=>{const q=$("#q-line");if(q)q.focus()},0)},
  recur(){const er=$("#r-err"),n=$("#r-n").value.trim(),amt=toNum($("#r-amt").value),day=Number($("#r-day").value);
    if(!n)return er.textContent="이름을 넣어 주세요.";if(!amt)return er.textContent="금액을 넣어 주세요.";if(!(day>=1&&day<=31))return er.textContent="1일부터 31일 사이로 넣어 주세요.";
    const type=$("#r-type").value;let cat=$("#r-cat").value;const isInc=cfg().incs.some(c=>c.id===cat);
    if(type==="in"&&!isInc)return er.textContent="수입이면 수입 분류를 골라 주세요.";if(type==="out"&&isInc)return er.textContent="지출이면 지출 분류를 골라 주세요.";
    put("recur",uid(),{n,cat,amt,day,pay:$("#r-pay").value,type,on:true,start:ymOf(todayStr()),skip:[]});ensureRecurring();toast(n+"을(를) 등록했어요");
    ["r-n","r-amt","r-day"].forEach(i=>{$("#"+i).value=""});render()},
  fund(){const er=$("#fd-err"),n=$("#fd-n").value.trim(),t=toNum($("#fd-t").value),due=$("#fd-due").value;
    if(!n)return er.textContent="이름을 넣어 주세요.";if(!t)return er.textContent="목표 금액을 넣어 주세요.";if(!/^\d{4}-\d{2}$/.test(due))return er.textContent="필요한 달을 골라 주세요.";
    put("funds",uid(),{n,target:t,due,saved:0,log:[]});$("#fd-n").value="";$("#fd-t").value="";render()},
  event(){const er=$("#e-err"),p=$("#e-p").value.trim(),amt=toNum($("#e-amt").value),date=$("#e-date").value;
    if(!p)return er.textContent="이름을 넣어 주세요.";if(!amt)return er.textContent="금액을 넣어 주세요.";if(!date)return er.textContent="날짜를 골라 주세요.";
    if(locked(ymOf(date)))return er.textContent="그 달은 마감돼 있어요.";
    const dir=$("#e-dir").value,eid="e"+uid(),tid=uid(),kind=$("#e-kind").value,memo=$("#e-memo").value.trim();
    const cat=dir==="give"?(cfg().cats.find(c=>c.ev)||{}).id:(cfg().incs.find(c=>c.ev)||{}).id;
    put("events",eid,{date,person:p,rel:$("#e-rel").value.trim(),kind,dir,amt,memo,tx:tid});
    put("tx",tid,{date,type:dir==="give"?"out":"in",cat:cat||"c17",amt,memo:p+" "+kind,pay:$("#e-pay").value,ev:eid,at:Date.now()});
    toast("적었어요");["e-p","e-rel","e-amt","e-memo"].forEach(i=>{$("#"+i).value=""});render()},
  lend(){const er=$("#l-err"),p=$("#l-p").value.trim(),amt=toNum($("#l-amt").value);
    if(!p)return er.textContent="누구에게인지 넣어 주세요.";if(!amt)return er.textContent="금액을 넣어 주세요.";
    put("lends",uid(),{date:$("#l-date").value||todayStr(),person:p,amt,kind:$("#l-kind").value,memo:$("#l-memo").value.trim(),back:[],done:false});["l-p","l-amt","l-memo"].forEach(i=>{$("#"+i).value=""});render()},
};
document.addEventListener("input",e=>{const el=e.target;
  if(el.hasAttribute("data-money")){const n=toNum(el.value);const pos=el.value.length-el.selectionStart;el.value=n?won(n):"";try{const p=Math.max(0,el.value.length-pos);el.setSelectionRange(p,p)}catch(x){}}
  if(el.dataset.input==="filter")renderListBody();
  if(el.dataset.input==="evq"){S.evq=el.value;const pos=el.selectionStart;render();const n=$("#ev-q");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}}
  if(el.id==="q-line"){if(!el.value.trim())S.qover={};quickHint();const er=$("#q-err");if(er)er.textContent=""}
  if(el.id==="s-amt"&&SH){SH.amtStr=cleanExpr(el.value);syncAmt()}
  if(el.id==="s-memo")sheetHint();
  if(el.dataset.split==="amt"&&SH){readSheet()}
});
document.addEventListener("change",e=>{const el=e.target;
  if(el.dataset.input==="filter")renderListBody();
  if(el.id==="s-date"&&SH){readSheet();drawSheet()}
  if(el.id==="q-pay"){S.qover.pay=el.value}
  if(el.dataset.split==="amt"||el.dataset.split==="cat"){readSheet();drawSheet()}
  if(el.dataset.cfg){const path=el.dataset.cfg.split(".");let v=el.type==="checkbox"?(el.checked?1:0):el.value;
    if(el.hasAttribute("data-money"))v=toNum(v);else if(el.hasAttribute("data-int"))v=Number(String(v).replace(/[^\d]/g,""))||0;else if(typeof v==="string")v=v.trim();
    if(path[path.length-1]==="n"&&!v){render();return}
    editCfg(c=>{let o=c;for(let i=0;i<path.length-1;i++)o=o[path[i]];o[path[path.length-1]]=v});toast("설정을 바꿨어요");render()}
  if(el.id==="imp"&&el.files&&el.files[0]){const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(o.app!=="moneybook")throw 0;S.pendingImport=o;
    const n=Object.keys(o.tx||{}).length;$("#imp-confirm").innerHTML=`<div class="confirm" style="margin-top:12px"><b>백업에 기록 ${n}건이 있어요.</b>가져오면 같은 기록은 백업 내용으로 바뀌고, 나머지는 지금 가계부에 더해져요. 설정도 백업 것으로 바뀌어요.<div><button class="btn" style="height:38px" data-act="imp-yes">가져오기</button><button class="btn-s" data-act="imp-no">그만두기</button></div></div>`}
    catch(x){toast("머니북 백업 파일이 아니에요")}};fr.readAsText(el.files[0]);el.value=""}
});
async function importData(o){if(S.demo){toast("예시를 끈 다음 가져와 주세요");return}if(S.readOnly)return toast("보기 권한이라 가져올 수 없어요");
  $("#imp-confirm").innerHTML='<p class="muted" style="font-size:13px">가져오는 중…</p>';
  if(o.cfg)putCfg(o.cfg);let n=0;for(const c of COLLS){for(const [id,v] of Object.entries(o[c]||{})){put(c,id,v);n++;if(S.mode==="db"&&n%20===0)await new Promise(r=>setTimeout(r,250))}}
  toast("기록 "+n+"건을 가져왔어요");render()}
function route(){const h=(location.hash||"#home").slice(1);const r=["home","cal","list","stats","book","setup"].includes(h)?h:"home";if(r===S.route)return;S.route=r;render();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
S.route=["home","cal","list","stats","book","setup"].includes((location.hash||"").slice(1))?(location.hash||"").slice(1):"home";
render();initStore();
})();
</script>
